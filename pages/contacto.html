<!doctype html>
<html lang="en">
  <!--HEAD: no es visible -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>MLB Teams - Contactos</title>
  </head>

  <!--BODY: es visible -->
  <body>
    <!--HEADER: estructura básica - cabecera -->
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img src="../images/MLB-Logo-1969.png" alt="MLB Pins Store" />
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <!--MAIN: estructura básica - cuerpo de la página -->
    <main>
      <h1 class="titulo-contacto text-secondary">Contactanos</h1>

      <form
        class="form-contacto"
        action="https://formspree.io/f/xkoyvvyz"
        method="POST"
      >
        <div class="grupo-input">
          <label for="email">Email: </label>
          <input id="email" type="email" name="email" />
        </div>

        <div class="grupo-input">
          <label for="message">Message: </label>
          <textarea id="message" name="message"></textarea>
        </div>

        <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
      </form>
    </main>

    <!--FOOTER: estructura básica - pie de la página -->
    <footer>
      <p>Sitio realizado por ArielB para Talento Tech - 2026</p>
      <nav>
        <ul class="footer-list">
          <!-- usar FlexBox Center -->
          <li><img src="../images/whatsapp.png" alt="logo de whatsapp" /></li>
          <li><img src="../images/instagram.png" alt="logo de instagram" /></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
